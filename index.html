              "name": "Is family mediation compulsory before applying to court?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Under Family Procedure Rules 2010 Part 3, attending a statutory Mediation Information and Assessment Meeting (MIAM) is mandatory before submitting a court application for child arrangements (Form C100) or financial remedy (Form A), unless a formal exemption such as documented domestic abuse applies."
              }

              "@type": "Question",
              "name": "Can we settle our divorce finances entirely without attending court?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Once an agreement is reached in mediation, your solicitor drafts a Consent Order based on our Memorandum of Understanding and submits it to court for administrative review by a judge, requiring zero court hearings."
              }

              "@type": "Question",
              "name": "Is a mediated Parenting Plan legally binding?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A Parenting Plan is a voluntary agreement built on mutual cooperation. If parents require formal legal enforceability, a family solicitor can convert the agreed plan into a draft Child Arrangements Consent Order for court approval."
              }
            },
            {
              "@type": "Question",
              "name": "How do we determine what happens to the family home?",
              "acceptedAnswer": {
                "@type": "Answer",
